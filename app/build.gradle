plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.rfscythe.commandops'
    compileSdk 36
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.rfscythe.commandops"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.2.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.github.sceneview:arsceneview:2.3.1'
}

// ---- CesiumJS 1.114 vendoring (offline 3D globe) ----
// Downloads the Cesium build + assets once into src/main/assets/cesium/
// (gitignored). The APK stays fully offline-capable: no CDN at runtime.
def cesiumDir = file("src/main/assets/cesium")
def cesiumJs = new File(cesiumDir, "Cesium.js")
tasks.register("downloadCesium") {
    doLast {
        if (cesiumJs.exists()) {
            println("Cesium 1.114 already vendored, skipping download.")
            return
        }
        cesiumDir.mkdirs()
        def tmpZip = new File(buildDir, "cesium-1.114.zip")
        println("Downloading CesiumJS 1.114...")
        new URL("https://github.com/CesiumGS/cesium/releases/download/1.114/Cesium-1.114.zip").withInputStream { i ->
            tmpZip.withOutputStream { it << i }
        }
        println("Extracting Cesium build (Cesium.js + Widgets + Assets, no Workers)...")
        copy {
            from(zipTree(tmpZip)) {
                include "Build/Cesium/Cesium.js"
                include "Build/Cesium/Widgets/**"
                include "Build/Cesium/Assets/**"
                exclude "Build/Cesium/Workers/**"
            }
            into cesiumDir
            eachFile { details -> details.path = details.path.replaceFirst("Build/Cesium/", "") }
            includeEmptyDirs = false
        }
        tmpZip.delete()
        println("Cesium 1.114 vendored at ${cesiumDir}")
    }
}
tasks.named("preBuild").configure { dependsOn("downloadCesium") }
